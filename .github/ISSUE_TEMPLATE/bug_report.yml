name: Bug report
description: Report a reproducible problem in the Java Optional skill, evals, docs, or automation.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Don't include Tessl tokens, GitHub tokens, package manager tokens, private repository links, private eval artifacts, private registry/workspace links, local host paths, proprietary Java source, or screenshots/logs containing those values.

        For suspected vulnerabilities, don't open a public issue. Use [private vulnerability reporting](https://github.com/martinfrancois/java-optionals-skill/security/advisories/new).
  - type: textarea
    id: summary
    attributes:
      label: Describe the bug
      description: Give a clear, short description of the user-visible problem.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where did this happen?
      options:
        - Skill behavior
        - README or docs
        - Evals or scoring
        - Tessl install or plugin metadata
        - Tessl publish or registry display
        - CI, release, or dependency automation
        - Not sure
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: List the steps, commands, or actions needed to see the problem. Use a small sanitized example when possible.
      placeholder: |
        1. Start from ...
        2. Run or ask ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: prompt-and-starting-code
    attributes:
      label: Prompt and starting code
      description: For agent-output bugs, paste the exact prompt and smallest sanitized Java code used before running it.
      placeholder: |
        Prompt:

        Starting code:
      render: text
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Describe what actually happened. Include error messages as text instead of screenshots of text.
    validations:
      required: true
  - type: textarea
    id: java-example
    attributes:
      label: Minimal Java example
      description: If the bug is about Optional guidance, paste the smallest sanitized Java example that shows it.
      render: java
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste sanitized command output, eval output, CI links, or Tessl output if useful.
      render: text
  - type: input
    id: plugin-version
    attributes:
      label: Tessl plugin version
      description: Paste the published plugin version, `tessl` output, or the commit SHA if known.
      placeholder: "martinfrancois/java-optionals version or commit SHA: "
  - type: input
    id: model
    attributes:
      label: Model
      description: For agent-output bugs, name the model that produced the behavior.
      placeholder: "For example: Claude Opus 4.8 or GPT-5.5"
  - type: dropdown
    id: reasoning-effort
    attributes:
      label: Reasoning effort
      description: For agent-output bugs, select the reasoning effort used.
      options:
        - none
        - low
        - medium
        - high
        - xhigh
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the tool or coding agent, Tessl CLI version, Java version, operating system, and package runner if relevant.
      placeholder: |
        - Coding agent:
        - Tessl CLI:
        - Java:
        - OS:
        - Package runner:
  - type: textarea
    id: workaround
    attributes:
      label: Workaround
      description: If you found a temporary workaround, describe exactly what you did. If not, write "None known".
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add recent changes, links, screenshots without secrets, or anything else that may affect reproduction.
  - type: checkboxes
    id: ai-assistance
    attributes:
      label: AI Assistance (if used)
      description: If an AI agent helped prepare this report, mark the relevant boxes. Otherwise leave this blank.
      options:
        - label: AI-assisted issue
          required: false
        - label: I confirm I understand and reviewed this report
          required: false
  - type: textarea
    id: ai-context
    attributes:
      label: AI prompts / session logs (optional)
      description: Add redacted prompts or session excerpts if they help reviewers understand the report.
      render: text
