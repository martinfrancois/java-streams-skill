name: Feature request
description: Suggest a change to skill behavior, evals, docs, metadata, or contribution workflow.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem should this solve?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Skill behavior
        - Optional example or reference material
        - Evals or scoring
        - README or docs
        - Tessl install or plugin metadata
        - CI, release, or dependency automation
        - Other
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Describe the solution you want
      description: Describe the behavior, docs, eval, metadata, or workflow you want.
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Examples
      description: Add a small Java Optional example, prompt, eval idea, or link if it helps explain the request.
      render: text
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: List simpler or narrower options if you considered them.
  - type: textarea
    id: workaround
    attributes:
      label: Current workaround
      description: If there is a workaround today, describe it and why it's clumsy or incomplete.
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add screenshots, workflow snippets, or links that clarify the request.
  - type: checkboxes
    id: ai-assistance
    attributes:
      label: AI Assistance (if used)
      description: If an AI agent helped prepare this request, mark the relevant boxes. Otherwise leave this blank.
      options:
        - label: AI-assisted issue
          required: false
        - label: I confirm I understand and reviewed this request
          required: false
  - type: textarea
    id: ai-context
    attributes:
      label: AI prompts / session logs (optional)
      description: Add redacted prompts or session excerpts if they help reviewers understand the request.
      render: text
