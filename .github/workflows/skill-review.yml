name: Skill Review

permissions:
  contents: read

# No paths filter: "Tessl skill review" is a required check, so it has to report on every PR.
# The "Detect skill review inputs" step skips the review when nothing it reads has changed.
on:
  pull_request:
    branches:
      - main

concurrency:
  group: skill-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Tessl skill review
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      TESSL_TOKEN_AVAILABLE: ${{ secrets.TESSL_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR merge commit and its base parent, enough to list the files this PR changes.
          fetch-depth: 2
          persist-credentials: false

      - name: Detect skill review inputs
        id: inputs
        run: |
          changed=false
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/skill-review.yml | .tessl-plugin/plugin.json | tile.json | tessl.json | \
                README.md | CONTRIBUTING.md | docs/agents/* | skills/java-streams/*)
                changed=true
                ;;
            esac
          done < <(git diff --name-only HEAD^1 HEAD)
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          if [[ "$changed" != "true" ]]; then
            echo "No file the skill review reads changed; skipping Tessl skill review."
          fi

      - name: Skip review when Tessl token is unavailable
        if: ${{ steps.inputs.outputs.changed == 'true' && env.TESSL_TOKEN_AVAILABLE != 'true' }}
        run: echo "TESSL_TOKEN isn't configured; skipping Tessl skill review."

      - name: Setup Tessl CLI
        if: ${{ steps.inputs.outputs.changed == 'true' && env.TESSL_TOKEN_AVAILABLE == 'true' }}
        uses: tesslio/setup-tessl@25ec223fc0da33b41b8044ff5ab2b85235f4f91e # v2
        with:
          version: "0.112.0"
          token: ${{ secrets.TESSL_TOKEN }}

      - name: Review skill
        if: ${{ steps.inputs.outputs.changed == 'true' && env.TESSL_TOKEN_AVAILABLE == 'true' }}
        run: tessl review run --workspace martinfrancois --threshold 100 skills/java-streams/SKILL.md
