name: Skill Review

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/skill-review.yml"
      - ".tessl-plugin/plugin.json"
      - "tile.json"
      - "tessl.json"
      - "README.md"
      - "CONTRIBUTING.md"
      - "docs/agents/**"
      - "skills/java-streams/**"

concurrency:
  group: skill-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Tessl skill review
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      TESSL_TOKEN_AVAILABLE: ${{ secrets.TESSL_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Skip review when Tessl token is unavailable
        if: ${{ env.TESSL_TOKEN_AVAILABLE != 'true' }}
        run: echo "TESSL_TOKEN isn't configured; skipping Tessl skill review."

      - name: Setup Tessl CLI
        if: ${{ env.TESSL_TOKEN_AVAILABLE == 'true' }}
        uses: tesslio/setup-tessl@25ec223fc0da33b41b8044ff5ab2b85235f4f91e # v2
        with:
          version: "0.95.0"
          token: ${{ secrets.TESSL_TOKEN }}

      - name: Review skill
        if: ${{ env.TESSL_TOKEN_AVAILABLE == 'true' }}
        run: tessl review run --workspace martinfrancois --threshold 100 skills/java-streams/SKILL.md
