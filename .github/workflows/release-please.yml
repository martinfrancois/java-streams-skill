name: Release Please

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Create or update release PR
    runs-on: ubuntu-latest
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Trigger Tessl publish
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail

          if [ -z "${TAG_NAME:-}" ]; then
            echo "Release Please reported a release but did not output tag_name." >&2
            exit 1
          fi

          gh workflow run publish-tessl.yml --repo "$GITHUB_REPOSITORY" --ref main -f ref="$TAG_NAME"

      - name: Find release PR
        id: release-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          pr_json="$(gh pr list \
            --state open \
            --head release-please--branches--main--components--java-optionals \
            --json title,headRefName \
            --jq '.[0] // empty')"

          if [ -z "$pr_json" ]; then
            echo "No open release PR to check."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          title="$(printf '%s\n' "$pr_json" | jq -r '.title')"
          branch="$(printf '%s\n' "$pr_json" | jq -r '.headRefName')"

          {
            echo "found=true"
            echo "title<<EOF"
            printf '%s\n' "$title"
            echo "EOF"
            echo "branch<<EOF"
            printf '%s\n' "$branch"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        if: ${{ steps.release-pr.outputs.found == 'true' }}
        with:
          fetch-depth: 0
          ref: ${{ steps.release-pr.outputs.branch }}

      - name: Setup Tessl CLI
        if: ${{ steps.release-pr.outputs.found == 'true' }}
        uses: tesslio/setup-tessl@25ec223fc0da33b41b8044ff5ab2b85235f4f91e # v2
        with:
          version: "0.81.2"
          token: ${{ secrets.TESSL_TOKEN }}

      - name: Validate release PR
        if: ${{ steps.release-pr.outputs.found == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TESSL_TOKEN: ${{ secrets.TESSL_TOKEN }}
          STATUS_SHA: ${{ github.sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          release_sha="$(git rev-parse HEAD)"
          context="Validate skill and plugin"

          set_status() {
            local state="$1"
            local description="$2"
            gh api "repos/${GITHUB_REPOSITORY}/statuses/${release_sha}" \
              -f state="$state" \
              -f context="$context" \
              -f description="$description" \
              -f target_url="$TARGET_URL" >/dev/null
          }

          set_status pending "Release PR validation is running"
          trap 'code=$?; if [ "$code" -eq 0 ]; then set_status success "Release PR validation passed"; else set_status failure "Release PR validation failed"; fi' EXIT

          python3 scripts/validate_skill.py skills/java-optionals
          python3 scripts/validate_eval_criteria.py evals evals-reference
          python3 -m py_compile scripts/validate_skill.py scripts/validate_eval_criteria.py
          bash -n scripts/check_publish_dry_run.sh
          tessl plugin lint .

          if [ -n "${TESSL_TOKEN:-}" ]; then
            bash scripts/check_publish_dry_run.sh .
            tessl plugin publish --dry-run .
          else
            echo "TESSL_TOKEN isn't configured; skipping publish dry-run."
          fi

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        if: ${{ steps.release-pr.outputs.found == 'true' }}
        with:
          node-version: "24"

      - name: Commitlint release PR
        if: ${{ steps.release-pr.outputs.found == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ steps.release-pr.outputs.title }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          release_sha="$(git rev-parse HEAD)"
          context="Commitlint"

          set_status() {
            local state="$1"
            local description="$2"
            gh api "repos/${GITHUB_REPOSITORY}/statuses/${release_sha}" \
              -f state="$state" \
              -f context="$context" \
              -f description="$description" \
              -f target_url="$TARGET_URL" >/dev/null
          }

          set_status pending "Release PR commitlint is running"
          trap 'code=$?; if [ "$code" -eq 0 ]; then set_status success "Release PR commitlint passed"; else set_status failure "Release PR commitlint failed"; fi' EXIT

          commitlint_home="$RUNNER_TEMP/commitlint"
          mkdir -p "$commitlint_home"
          printf '{"private":true}\n' > "$commitlint_home/package.json"
          cp commitlint.config.cjs "$commitlint_home/commitlint.config.cjs"
          npm --prefix "$commitlint_home" install --silent \
            @commitlint/cli@21.0.1 \
            @commitlint/config-conventional@21.0.1

          commitlint_bin="$commitlint_home/node_modules/.bin/commitlint"
          commitlint_config="$commitlint_home/commitlint.config.cjs"

          printf '%s\n' "$PR_TITLE" | "$commitlint_bin" --config "$commitlint_config"
          git fetch origin main
          "$commitlint_bin" --config "$commitlint_config" \
            --from origin/main --to HEAD --verbose
